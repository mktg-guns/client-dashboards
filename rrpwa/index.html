    document.getElementById("domline").textContent=s.domain;
  }

  function prevMonth(s,m){ var i=s.order.indexOf(m); return i>0 ? s.order[i-1] : null; }

  function setTab(t){
    document.querySelectorAll(".tabs button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-tab")===t); });
    document.getElementById("tab-overview").hidden = t!=="overview";
    document.getElementById("tab-rankings").hidden = t!=="rankings";
  }

  function deltaChip(cur,prev,opts){
    opts=opts||{};
    if(prev===null||prev===undefined||cur===null||cur===undefined){ return '<span class="delta flat">new baseline</span>'; }
    var d=cur-prev, cls, arrow;
    if(d===0){ return '<span class="delta flat">no change <span class="cmp">vs '+monLabel(state._cmp)+'</span></span>'; }
    var goodUp = opts.good;
    if(goodUp===undefined){ cls = d>0?"up":"down"; }
    else { var positive = goodUp ? d>0 : d<0; cls = positive?"up":"down"; }
    if(opts.neutral){ cls="flat"; }
    arrow = d>0?"▲":"▼";
    var val = opts.dec ? (Math.abs(d)).toFixed(1) : fmt(Math.abs(d));
    var pct = (opts.pct && prev) ? " ("+(d>0?"+":"−")+Math.abs(Math.round(d/prev*100))+"%)" : "";
    return '<span class="delta '+cls+'">'+arrow+' '+val+pct+' <span class="cmp">vs '+monLabel(state._cmp)+'</span></span>';
  }

  function render(){
    var s=site(), m=state.month, mo=s.months[m], pm=prevMonth(s,m), pmo=pm?s.months[pm]:null;
    state._cmp=pm;
    document.getElementById("chgcmp").textContent = pm?monLabel(pm):"—";
    var met=mo.metrics, pmet=pmo?pmo.metrics:{};
    var tileDefs=[
      {k:"Organic traffic",  v:fmt(met.traffic), cur:met.traffic, prev:pmet.traffic, o:{good:true,pct:true}},
      {k:"Top-3 keywords",   v:fmt(met.top3),    cur:met.top3,    prev:pmet.top3,    o:{good:true}},
      {k:"Total keywords",   v:fmt(met.keywords),cur:met.keywords,prev:pmet.keywords,o:{good:true}},
      {k:"Domain Rating",    v:(met.dr==null?"—":met.dr.toFixed(1)), cur:met.dr, prev:pmet.dr, o:{good:true,dec:true}},
      {k:"Referring domains",v:fmt(met.rd),      cur:met.rd,      prev:pmet.rd,      o:{neutral:true}},
      {k:"Backlinks",        v:fmt(met.backlinks),cur:met.backlinks,prev:pmet.backlinks,o:{neutral:true}}
    ];
    document.getElementById("tiles").innerHTML=tileDefs.map(function(t){
      return '<div class="tile"><div class="k">'+t.k+'</div><div class="v">'+t.v+'</div>'+deltaChip(t.cur,t.prev,t.o)+'</div>';
    }).join("");
    renderChanges(mo); renderTrend(s,m); renderRankings(mo); renderRead(s,m,mo,pmo);
  }

  function classify(kw){
    var p=kw.pos, pp=kw.pos_prev;
    if(p!=null && pp==null) return "new";
    if(p==null && pp!=null) return "exit";
    if(p!=null && pp!=null){ if(p<pp) return "up"; if(p>pp) return "down"; return "flat"; }
    return "flat";
  }

  function renderChanges(mo){
    var list=document.getElementById("chglist"), counts=document.getElementById("chgcounts");
    if(!mo.keywords || !mo.keywords.length){
      counts.innerHTML=""; list.innerHTML='<div class="note">Per-keyword comparison starts from the first month with keyword detail. Metric tiles above still compare month-over-month.</div>';
      return;
    }
    var buckets={new:[],up:[],down:[],exit:[]};
    mo.keywords.forEach(function(k){ var c=classify(k); if(buckets[c]) buckets[c].push(k); });
    buckets.up.sort(function(a,b){return (a.pos)-(b.pos);});
    buckets.down.sort(function(a,b){return (b.traffic_prev||0)-(a.traffic_prev||0);});
    buckets.exit.sort(function(a,b){return (b.traffic_prev||0)-(a.traffic_prev||0);});
    counts.innerHTML=
      '<span class="pill">'+buckets.new.length+' entered</span>'+
      '<span class="pill">'+buckets.up.length+' moved up</span>'+
      '<span class="pill">'+buckets.down.length+' moved down</span>'+
      (buckets.exit.length?'<span class="pill">'+buckets.exit.length+' exited</span>':'');
    function row(k,tag){
      var mv;
      if(tag==="new") mv="now #"+k.pos;
      else if(tag==="exit") mv="was #"+k.pos_prev;
      else mv="#"+k.pos_prev+" → #"+k.pos;
      var tl=(k.traffic!=null?k.traffic:0), tp=(k.traffic_prev!=null?k.traffic_prev:0), td=tl-tp;
      var tnote = td? (" · "+(td>0?"+":"−")+Math.abs(td)+" vis") : "";
      var lbl={new:"NEW",up:"UP",down:"DOWN",exit:"EXIT"}[tag];
      return '<div class="chgrow"><span class="tagc '+tag+'">'+lbl+'</span><span>'+k.kw+'</span><span class="mv">'+mv+tnote+'</span></div>';
    }
    var html="";
    buckets.new.forEach(function(k){html+=row(k,"new");});
    buckets.up.forEach(function(k){html+=row(k,"up");});
    buckets.down.forEach(function(k){html+=row(k,"down");});
    buckets.exit.forEach(function(k){html+=row(k,"exit");});
    list.innerHTML=html || '<div class="note">No ranking movements recorded.</div>';
  }

  function renderTrend(s,m){
    var ms=s.order, max=0;
    ms.forEach(function(x){ var v=s.months[x].metrics.traffic||0; if(v>max)max=v; });
    document.getElementById("trend").innerHTML=ms.map(function(x){
      var v=s.months[x].metrics.traffic||0, h=max? Math.max(4, Math.round(v/max*120)) : 4;
      return '<div class="bar '+(x===m?"cur":"")+'"><div class="num">'+fmt(v)+'</div><div class="col" style="height:'+h+'px"></div><div class="lab">'+monLabel(x)+'</div></div>';
    }).join("");
  }

  function renderRankings(mo){
    var card=document.getElementById("rankcard");
    if(!mo.keywords || !mo.keywords.length){ card.innerHTML='<div class="note">No keyword detail stored for this month.</div>'; return; }
    var rows=mo.keywords.slice().sort(function(a,b){ return (b.traffic||0)-(a.traffic||0); });
    var body=rows.map(function(k){
      var badge="", c=classify(k);
      if(c==="new") badge='<span class="mini new">NEW</span>';
      else if(c==="up") badge='<span class="mini up">▲'+(k.pos_prev-k.pos)+'</span>';
      else if(c==="down") badge='<span class="mini down">▼'+(k.pos-k.pos_prev)+'</span>';
      else if(c==="exit") badge='<span class="mini exit">EXIT</span>';
      var posCell = k.pos==null ? '<span class="pos">—</span>'+badge : '<span class="pos">'+k.pos+'</span>'+badge;
      var tl=(k.traffic!=null?k.traffic:0), tp=(k.traffic_prev!=null?k.traffic_prev:0), td=tl-tp;
      var tdc = td? ' <span class="mini '+(td>0?"up":"down")+'">'+(td>0?"+":"−")+Math.abs(td)+'</span>':'';
      return '<tr>'+
        '<td><span class="kw">'+k.kw+'</span><span class="url">'+pageOf(k.url)+'</span></td>'+
        '<td>'+posCell+'</td>'+
        '<td class="num">'+fmt(k.vol)+'</td>'+
        '<td class="num">'+fmt(k.kd)+'</td>'+
        '<td class="num">'+fmt(tl)+tdc+'</td>'+
        '</tr>';
    }).join("");
    card.innerHTML='<div style="overflow:auto"><table><thead><tr><th>Keyword / page</th><th>Position</th><th class="num">Volume</th><th class="num">KD</th><th class="num">Traffic</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  function renderRead(s,m,mo,pmo){
    var el=document.getElementById("readline");
    var t=mo.metrics.traffic, pt=pmo?pmo.metrics.traffic:null;
    var parts=[];
    if(pt!=null && t!=null){
      var d=t-pt, pct=pt?Math.round(d/pt*100):0;
      parts.push("Organic traffic "+(d>=0?"up":"down")+" "+Math.abs(pct)+"% ("+fmt(t)+" vs "+fmt(pt)+" in "+monLabel(prevMonth(s,m)||m)+").");
    } else {
      parts.push("Organic traffic "+fmt(t)+".");
    }
    if(mo.keywords && mo.keywords.length){
      var b={new:0,up:0,down:0,exit:0}; mo.keywords.forEach(function(k){b[classify(k)]++;});
      parts.push(b.new+" entered, "+b.up+" up, "+b.down+" down"+(b.exit?", "+b.exit+" exited":"")+".");
    }
    if(mo.note) parts.push(mo.note);
    el.textContent=parts.join(" ");
  }
})();
</script>
</body>
