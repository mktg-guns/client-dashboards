const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.data));
  return new TextDecoder().decode(buf);
}
async function attempt(pw,silent){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Unlocking…';err.textContent='';
  try{
    const html=await unlock(pw);
    sessionStorage.setItem('mg_pw',pw);
    document.open();document.write(html);document.close();
  }catch(e){
    btn.disabled=false;btn.textContent='View dashboard';
    if(!silent){err.textContent='Wrong password — check your latest email from MKTG Guns.';}
    sessionStorage.removeItem('mg_pw');
  }
}
document.getElementById('go').addEventListener('click',()=>attempt(document.getElementById('pw').value));
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')attempt(e.target.value)});
const saved=sessionStorage.getItem('mg_pw');
if(saved)attempt(saved,true);
